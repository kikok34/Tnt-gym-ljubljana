<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="50%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <radialGradient id="light-hero" cx="75%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ff7a18" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="cage-mesh" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Base Dark Gym Atmosphere -->
  <rect width="1200" height="800" fill="url(#bg-hero)" />
  <rect width="1200" height="800" fill="url(#cage-mesh)" />
  <circle cx="900" cy="220" r="520" fill="url(#light-hero)" />

  <!-- Athletic Diagonal Energy Beams -->
  <path d="M 850 0 L 1050 0 L 750 800 L 550 800 Z" fill="rgba(255, 59, 48, 0.04)" />
  <path d="M 1080 0 L 1200 0 L 960 800 L 840 800 Z" fill="rgba(255, 122, 24, 0.03)" />

  <!-- Subtle Boxing Ring Ropes & Octagon Post Silhouette -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="3">
    <line x1="0" y1="520" x2="1200" y2="460" />
    <line x1="0" y1="600" x2="1200" y2="540" />
    <line x1="0" y1="680" x2="1200" y2="620" />
  </g>
  <rect x="920" y="380" width="28" height="360" rx="6" fill="rgba(255, 59, 48, 0.12)" stroke="rgba(255, 59, 48, 0.25)" stroke-width="1.5" />
</svg>
